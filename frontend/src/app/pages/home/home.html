<!-- Hero Section -->
<section class="hero text-center bg-light py-5">
  <div class="container">
    <h1 class="display-4">Your Trusted Online Pharmacy</h1>
    <p class="lead">Search and order medicines safely from home</p>
    <input class="form-control form-control-lg w-50 mx-auto my-4" placeholder="Search for medicines...">
    <button class="btn btn-primary btn-lg">Search</button>
  </div>
</section>

<!-- Categories -->
<section class="categories py-5 bg-white text-center">
  <div class="container">
    <h2 class="mb-4">Shop by Category</h2>
    <div class="row">
      <div class="col-md-3" *ngFor="let cat of ['Pain Relief', 'Cold & Flu', 'Diabetes', 'Skin Care']">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">{{ cat }}</h5>
            <button class="btn btn-outline-primary">Explore</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Top Products -->
<section class="top-products py-5 bg-light">
  <div class="container">
    <h2 class="text-center mb-4">Top Medicines</h2>
    <div class="row">
      <div class="col-md-4" *ngFor="let product of topProducts">
        <div class="card mb-4 shadow-sm">
          <img [src]="product.image" class="card-img-top" [alt]="product.name">
          <div class="card-body">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="card-text">{{ product.description }}</p>
            <button class="btn btn-success">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>


<h2>{{ message }}</h2>
<p>Loading Home...</p>
